<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Entropy Generator — Live Space Telemetry TRNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="header">
      <h1>🛰️ Cosmic Entropy Generator</h1>
    </div>
    <button id="langToggle" class="lang-btn" onclick="toggleLanguage()" title="Switch language">RU</button>
  </div>

  <p id="subtitle" class="subtitle">
    Cryptographic key generator powered by live space telemetry (NOAA SWPC, GOES, SOLAR-1/ACE, and ISS). Runs entirely in your browser with hybrid hardware CSPRNG seeding.
  </p>

  <label id="sourceLabel" for="sourceSelect">Select cosmic data source:</label>
  <select id="sourceSelect">
    <option value="all" data-en="0. [Multi-Stream] Combine all 5 space APIs simultaneously (Max entropy)" data-ru="0. [Мульти-поток] Объединить все 5 космических API сразу (Макс. энтропия)">0. [Multi-Stream] Combine all 5 space APIs simultaneously (Max entropy)</option>
    <option value="solar_wind" data-en="1. NOAA RTSW — Real-Time Solar Wind Plasma (Lagrange Point L1)" data-ru="1. NOAA RTSW — Солнечный ветер в реальном времени (точка Лагранжа L1)">1. NOAA RTSW — Real-Time Solar Wind Plasma (Lagrange Point L1)</option>
    <option value="mag_field" data-en="2. NOAA RTSW — Interplanetary Magnetic Field (Bx, By, Bz vectors)" data-ru="2. NOAA RTSW — Межпланетное магнитное поле (векторы Bx, By, Bz)">2. NOAA RTSW — Interplanetary Magnetic Field (Bx, By, Bz vectors)</option>
    <option value="xray" data-en="3. NOAA GOES — Solar Corona X-Ray Flux" data-ru="3. NOAA GOES — Рентгеновское излучение солнечной короны">3. NOAA GOES — Solar Corona X-Ray Flux</option>
    <option value="protons" data-en="4. NOAA GOES — High-Energy Cosmic Proton Flux" data-ru="4. NOAA GOES — Потоки высокоэнергетических космических протонов">4. NOAA GOES — High-Energy Cosmic Proton Flux</option>
    <option value="iss" data-en="5. ISS Orbital Telemetry — Coordinates, velocity & solar angles" data-ru="5. Орбитальная телеметрия МКС — Координаты, скорость и солнечные углы">5. ISS Orbital Telemetry — Coordinates, velocity & solar angles</option>
  </select>

  <button id="generateBtn" class="btn-primary" onclick="harvestEntropy()">
    Harvest Cosmic Entropy
  </button>

  <div id="statusLog" class="status-log"></div>

  <div id="resultBox" class="result-box">
    <div class="meta-grid">
      <div class="meta-item">
        <span id="metaSourceLabel">Active Sources</span>
        <strong id="metaSource">—</strong>
      </div>
      <div class="meta-item">
        <span id="metaBytesLabel">Entropy Pool Size</span>
        <strong id="metaBytes">—</strong>
      </div>
    </div>

    <div id="hashLabel" class="hash-label">256-Bit Cryptographic Key (SHA-256)</div>
    <div id="hashOutput" class="hash-output"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyHash()">Copy Key</button>

    <div class="raw-preview" id="rawPreview"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
