<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Entropy Generator — Live Space Telemetry TRNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="header">
      <h1>🛰️ Cosmic Entropy Generator</h1>
    </div>
    <div class="lang-switch" role="group" aria-label="Language switcher">
      <button id="langEn" class="lang-btn active" onclick="setLanguage('en')">EN</button>
      <button id="langRu" class="lang-btn" onclick="setLanguage('ru')">RU</button>
    </div>
  </div>

  <p id="subtitleText" class="subtitle">
    Cryptographic key generator powered by live orbital telemetry (NOAA SWPC, GOES, DSCOVR, and ISS) combined with hardware CSPRNG seeding. Runs entirely in your browser with zero backend.
  </p>

  <label id="selectLabel" for="sourceSelect">Select cosmic telemetry source:</label>
  <select id="sourceSelect">
    <option value="all" data-i18n="opt_all">0. [Multi-Stream] Combine all 5 cosmic APIs simultaneously (Max Entropy)</option>
    <option value="solar_wind" data-i18n="opt_sw">1. NOAA DSCOVR — Solar Wind (Plasma at Lagrange Point L1)</option>
    <option value="mag_field" data-i18n="opt_mag">2. NOAA DSCOVR — Interplanetary Magnetic Field (Bx, By, Bz vectors)</option>
    <option value="xray" data-i18n="opt_xray">3. NOAA GOES — Solar Corona X-Ray Flux</option>
    <option value="protons" data-i18n="opt_protons">4. NOAA GOES — High-Energy Cosmic Proton Flux</option>
    <option value="iss" data-i18n="opt_iss">5. ISS Orbital Telemetry — Coordinates, velocity, and solar angles</option>
  </select>

  <button id="generateBtn" class="btn-primary" onclick="harvestEntropy()">
    Harvest Cosmic Entropy
  </button>

  <div id="statusLog" class="status-log"></div>

  <div id="resultBox" class="result-box">
    <div class="meta-grid">
      <div class="meta-item">
        <span id="metaSourceLabel">Active Sources</span>
        <strong id="metaSource">—</strong>
      </div>
      <div class="meta-item">
        <span id="metaBytesLabel">Entropy Bytes Processed</span>
        <strong id="metaBytes">—</strong>
      </div>
    </div>

    <div id="hashLabel" class="hash-label">256-Bit Cryptographic Key (SHA-256)</div>
    <div id="hashOutput" class="hash-output"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyHash()">Copy Key</button>

    <div class="raw-preview" id="rawPreview"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
